{% extends "base.html" %}

{% block title %}Set New Password | Urban EV{% endblock %}

{% block content %}
<div class="standalone-login-wrapper">
  <div class="login-card">
    <div class="login-card-header">
      <div class="header-title">
        <h3>SET A NEW PASSWORD</h3>
        <div class="accent-line"></div>
      </div>
    </div>

    <p class="panel-copy">An administrator requires you to choose a new password before continuing.</p>

    {% if error %}
    <div class="alert-error" role="alert">{{ error }}</div>
    {% endif %}

    <form action="/rider/password-reset" method="POST">
      <div class="form-group">
        <label for="password">NEW PASSWORD</label>
        <input
          type="password"
          id="password"
          name="password"
          minlength="8"
          required
          autocomplete="new-password"
        >
      </div>

      <div class="form-group">
        <label for="confirm_password">CONFIRM NEW PASSWORD</label>
        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          minlength="8"
          required
          autocomplete="new-password"
        >
      </div>

      <button type="submit" class="submit-btn">SAVE NEW PASSWORD</button>
    </form>

    <p class="login-signup-link"><a href="/logout">Sign out</a></p>
  </div>
</div>
{% endblock %}
